events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    server_name localhost;

    location /authenticate {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://auth-service:3000/api/auth/validate;
    }

    location /api/health {
      proxy_pass http://auth-service:3000/api/health;
    }

    location /api/auth/register {
      proxy_pass http://auth-service:3000/api/auth/register;
    }

    location /api/auth/login {
      proxy_pass http://auth-service:3000/api/auth/login;
    }

    location /api/auth/ {
      auth_request /authenticate;
      proxy_set_header Authorization $http_authorization;
      proxy_pass http://auth-service:3000/api/auth/;
    }
  }
}